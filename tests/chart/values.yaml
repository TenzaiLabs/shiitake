# Default e2e profile. Override with `-f` or `--set` to deploy different
# server flavours (e.g. a tighter-memory pool to exercise OOM handling).

# Where the server and the workers run relative to each other.
#   single-pod — one pod, loopback dispatch, server-local output spool.
#   two-pod    — server and worker profiles in separate pods, dispatch through
#                a Service, server-local output spool, pod-scoped controls.
topology: single-pod

authToken: e2e-secret-token
# Bearer token for the default worker profile. Extra profiles declare their
# own distinct dispatchToken below; a worker never needs the API's token.
dispatchToken: e2e-dispatch-token
captureRoot: /capture
workerCaptureRoot: /tmp/shiitake-capture
defaultWorkdir: /tmp

# The default worker profile mounts this application folder. Isolated workers
# do not mount it; stdout/stderr is streamed to the server in both profiles.
sharedFolder:
  hostPath: /var/lib/shiitake-e2e/shared
  mountPath: /shared

# Confine the worker pods: no ingress, egress only to DNS and the dispatcher.
# Two-pod only — a NetworkPolicy selects a pod, so co-located there is no way to
# treat the server and the workers differently.
networkPolicy:
  enabled: true

server:
  image: shiitake-server:e2e
  port: 8080
  dispatchPort: 8090
  # Registered workers (idle + in-flight) needed before /ready reports ready.
  # The readiness probe gates the pod on this, so the e2e never talks to a
  # server whose pool is still empty.
  minReadyWorkers: 1
  # Legacy PTY keepalive interval. Session workers use the pool keepalive.
  ptyKeepaliveSecs: 3
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

worker:
  image: shiitake-test-worker:e2e
  profile: default
  sharedFolder: true
  # Worker containers in the single pod, or worker pods in the two-pod topology.
  count: 8
  # Comma-separated scratch paths the worker empties between sessions. Exercises
  # the resident-worker reset path end-to-end in k8s. /dev/mqueue holds POSIX
  # message queues (not SysV, so remove_sysv_ipc skips them) — clearing the dir
  # unlinks the queues a fresh container would have discarded.
  resetPaths: "/tmp,/var/tmp,/dev/shm,/dev/mqueue"
  # Exit (recycle the container) after this many sessions. 0 = stay resident
  # and rely on the in-process reset; N>0 adds a periodic full-container
  # teardown. Set >0 to exercise the restartPolicy/recycle path in the e2e.
  restartAfter: 0
  # Where a named session's home is created (SHIITAKE_HOME_ROOT). Non-default so
  # the e2e proves the override relocates the home off /home.
  homeRoot: /var/lib/shiitake-homes
  # Worker session-lease watchdog (SHIITAKE_LEASE_TIMEOUT). Above the pool's ~10s
  # keepalive so idle/in-flight workers stay put, but low enough that the
  # keepalive quiet-session e2e outlasts it without a long sleep.
  leaseTimeout: 15
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 512Mi

# Additional profile: a separate worker Deployment in two-pod mode, with no
# application shared volume. In single-pod mode these are extra containers;
# two-pod mode gives them an independent pod and network-policy boundary.
workerProfiles:
  - name: isolated
    count: 2
    dispatchToken: e2e-isolated-dispatch-token
    sharedFolder: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: "1"
        memory: 512Mi

# Optional in-cluster OpenTelemetry Collector. When enabled, the server exports
# OTLP to it and re-exposes the metrics on a Prometheus endpoint the test run
# scrapes. The short export interval makes metrics show up within a test run.
otel:
  enabled: false
  image: otel/opentelemetry-collector-contrib:latest
  metricExportIntervalMs: 2000
