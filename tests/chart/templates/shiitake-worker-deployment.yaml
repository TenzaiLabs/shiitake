{{- if eq .Values.topology "two-pod" }}
{{/*
The worker pods: one worker per pod, `worker.count` replicas. A pod each is what
makes pod-scoped controls settable for the workers alone. Each takes its id from
its own pod name — the pool keys workers by id, so a shared literal would collide.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-workers
  labels:
    app: shiitake-worker
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.worker.count }}
  selector:
    matchLabels:
      app: shiitake-worker
      profile: {{ .Values.worker.profile }}
  template:
    metadata:
      labels:
        app: shiitake-worker
        profile: {{ .Values.worker.profile }}
        release: {{ .Release.Name }}
    spec:
      # The workers run arbitrary commands; only the server needs API access.
      automountServiceAccountToken: false
      containers:
        {{- include "shiitake.workerContainer" (dict
              "root" .
              "name" "worker"
              "profile" .Values.worker.profile
              "resources" .Values.worker.resources
              "sharedFolder" .Values.worker.sharedFolder
              "dispatchUrl" (printf "ws://%s-dispatch:%v/dispatch" .Release.Name (.Values.server.dispatchPort | toString))) | nindent 8 }}
      {{- if .Values.worker.sharedFolder }}
      volumes:
        {{- include "shiitake.sharedFolderVolume" (dict "root" .) | nindent 8 }}
      {{- end }}
{{- range $profile := .Values.workerProfiles }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-workers-{{ $profile.name }}
  labels:
    app: shiitake-worker
    profile: {{ $profile.name }}
    release: {{ $.Release.Name }}
spec:
  replicas: {{ $profile.count }}
  selector:
    matchLabels:
      app: shiitake-worker
      profile: {{ $profile.name }}
  template:
    metadata:
      labels:
        app: shiitake-worker
        profile: {{ $profile.name }}
        release: {{ $.Release.Name }}
    spec:
      automountServiceAccountToken: false
      containers:
        {{- include "shiitake.workerContainer" (dict
              "root" $
              "name" "worker"
              "profile" $profile.name
              "dispatchToken" $profile.dispatchToken
              "resources" $profile.resources
              "sharedFolder" $profile.sharedFolder
              "dispatchUrl" (printf "ws://%s-dispatch:%v/dispatch" $.Release.Name ($.Values.server.dispatchPort | toString))) | nindent 8 }}
      {{- if $profile.sharedFolder }}
      volumes:
        {{- include "shiitake.sharedFolderVolume" (dict "root" $) | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
