{{/*
The server Deployment, named after the release in both topologies so the test
scripts port-forward and tail logs the same way either way. In single-pod the
workers ride along as extra containers; in two-pod they get their own Deployment.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: shiitake
    release: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shiitake
  template:
    metadata:
      labels:
        app: shiitake
        release: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      containers:
        {{- if eq .Values.topology "two-pod" }}
        {{- include "shiitake.serverContainer" (dict "root" . "dispatchHost" "0.0.0.0") | nindent 8 }}
        {{- else }}
        {{- include "shiitake.serverContainer" (dict "root" . "dispatchHost" "127.0.0.1") | nindent 8 }}
        {{- range $i := until (int .Values.worker.count) }}
        {{- include "shiitake.workerContainer" (dict
              "root" $
              "name" (printf "worker-%d" $i)
              "workerId" (printf "worker-%d" $i)
              "dispatchUrl" (printf "ws://127.0.0.1:%v/dispatch" $.Values.server.dispatchPort)
              "perContainerRestart" true) | nindent 8 }}
        {{- end }}
        {{- end }}
      volumes:
        {{- include "shiitake.captureVolume" (dict "root" .) | nindent 8 }}
