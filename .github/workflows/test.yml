name: 🧪 Test

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  topology:
    # Both supported topologies run the same suite: the API contract does not
    # change when the server and the workers stop sharing a pod. two-pod adds
    # test_two_pod.py on top, for what the split makes newly true.
    name: 🚀 End-to-end (k3d, ${{ matrix.topology }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        topology:
          - single-pod
          - two-pod
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: 🧰 Install tools (mise)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: 🔨 Build server image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.server
          load: true
          tags: shiitake-server:e2e
          cache-from: type=gha,scope=shiitake-server
          cache-to: type=gha,mode=max,scope=shiitake-server

      - name: 🔨 Build worker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: tests/Dockerfile.worker
          load: true
          tags: shiitake-test-worker:e2e
          cache-from: type=gha,scope=shiitake-worker
          cache-to: type=gha,mode=max,scope=shiitake-worker

      - name: 🏗️ Set up the e2e cluster
        env:
          SHIITAKE_E2E_TOPOLOGY: ${{ matrix.topology }}
        run: bash tests/setup.sh

      - name: 🧫 Run end-to-end suite
        env:
          SHIITAKE_E2E_TOPOLOGY: ${{ matrix.topology }}
        run: bash tests/run.sh

  # The name branch protection requires. A matrix job reports one check per leg
  # ("… (single-pod)", "… (two-pod)"), so requiring the legs by name would mean
  # editing the ruleset every time the matrix changes — and a required context
  # that no job produces blocks every PR forever, waiting for a status that will
  # never arrive. This gate keeps one stable name over however many legs there
  # are. `always()` so a failed matrix reports failure here rather than skipping,
  # since a skipped required check blocks just the same.
  e2e:
    name: 🚀 End-to-end (k3d)
    runs-on: ubuntu-latest
    needs: topology
    if: always()
    steps:
      - name: ✅ Every topology passed
        env:
          RESULT: ${{ needs.topology.result }}
        run: |
          echo "end-to-end matrix result: ${RESULT}"
          [ "${RESULT}" = "success" ] || exit 1
