[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shiitake-py"
version = "0.4.0"
description = "Python client for the shiitake command-dispatch HTTP API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# The interactive PTY (`attach_pty`) is the only WebSocket in the API; the rest
# is plain HTTP over httpx. Callers that need a terminal install `shiitake-py[pty]`.
pty = [
    "websockets>=13",
]

[tool.hatch.build.targets.wheel]
packages = ["shiitake"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "websockets>=13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
