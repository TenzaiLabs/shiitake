[package]
name = "shiitake-rs"
edition.workspace = true
version.workspace = true

[dependencies]
shiitake-server-api = { path = "../../shiitake-server-api" }
# reqwest's `rustls` feature pulls in aws-lc-rs; this workspace is ring-only
# (see AGENTS.md), so take the provider-less variant and install ring ourselves.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
thiserror = "2"
